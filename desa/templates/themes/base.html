{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="web_standard" name="shell-type">
    <title>{% block title %}Website Resmi Desa Beriri Jarak{% endblock %}</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <style>
        @layer base {
            html, body { margin: 0; padding: 0; }
            body { overscroll-behavior: none; }
            main > :first-child { margin-top: 0 !important; }
            main > :last-child { margin-bottom: 0 !important; }
        }
        ::-webkit-scrollbar { display: none; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-error": "#ffffff", "surface": "#f8f9ff", "outline-variant": "#bfc9c3",
                        "surface-bg": "#F8FAFC", "accent-emerald": "#10B981",
                        "surface-container-lowest": "#ffffff", "secondary-fixed-dim": "#7bd8b1",
                        "surface-tint": "#2b6954", "tertiary-container": "#623c00",
                        "on-tertiary-fixed": "#2a1700", "outline": "#707974",
                        "surface-container-high": "#dce9ff", "on-primary-fixed": "#002117",
                        "on-secondary": "#ffffff", "tertiary": "#442800",
                        "tertiary-fixed-dim": "#ffb95f", "surface-bright": "#f8f9ff",
                        "gold-light": "#FEF3C7", "surface-container-low": "#eff4ff",
                        "on-secondary-fixed-variant": "#00513a", "on-tertiary-container": "#f69f0d",
                        "primary-container": "#064e3b", "on-primary": "#ffffff",
                        "secondary-fixed": "#97f5cc", "secondary-container": "#97f5cc",
                        "tertiary-fixed": "#ffddb8", "inverse-primary": "#95d3ba",
                        "background": "#f8f9ff", "on-surface": "#0b1c30",
                        "on-background": "#0b1c30", "surface-pure": "#FFFFFF",
                        "on-surface-variant": "#404944", "border-subtle": "#E2E8F0",
                        "on-tertiary": "#ffffff", "error-container": "#ffdad6",
                        "secondary": "#006c4e", "surface-dim": "#cbdbf5",
                        "surface-variant": "#d3e4fe", "on-secondary-fixed": "#002115",
                        "error": "#ba1a1a", "primary-fixed-dim": "#95d3ba",
                        "on-primary-container": "#80bea6", "primary": "#003527",
                        "accent-mint": "#34D399", "text-secondary": "#475569",
                        "on-primary-fixed-variant": "#0b513d", "on-secondary-container": "#007353",
                        "surface-container-highest": "#d3e4fe", "surface-container": "#e5eeff",
                        "inverse-surface": "#213145", "primary-fixed": "#b0f0d6",
                        "inverse-on-surface": "#eaf1ff", "text-primary": "#0F172A",
                        "on-tertiary-fixed-variant": "#653e00", "on-error-container": "#93000a"
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                    spacing: {
                        "gutter-mobile": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem",
                        "gutter": "1.5rem", "space-xl": "2rem", "margin-mobile": "1rem",
                        "space-md": "1rem", "margin": "2rem", "space-xs": "0.25rem"
                    },
                    fontFamily: {
                        "title-md": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"],
                        "headline-xl": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"],
                        "display-lg-mobile": ["Inter"], "display-lg": ["Inter"], "label-sm": ["Inter"],
                        "headline-xl-mobile": ["Inter"], "label-lg": ["Inter"], "title-lg": ["Inter"],
                        "body-sm": ["Inter"], "headline-lg": ["Inter"], "headline-sm": ["Inter"]
                    },
                    fontSize: {
                        "title-md": ["16px", { lineHeight: "24px", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "500" }],
                        "headline-xl-mobile": ["26px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
                        "title-lg": ["18px", { lineHeight: "26px", fontWeight: "600" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "headline-lg": ["30px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "headline-sm": ["20px", { lineHeight: "28px", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface font-body-md text-on-surface antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed-variant">

    {% include "themes/partials/header.html" %}

    <main class="w-full pt-28 bg-surface">
        {% block content %}{% endblock %}
    </main>

    {% include "themes/partials/footer.html" %}

    {% block extra_js %}{% endblock %}
</body>
</html>
