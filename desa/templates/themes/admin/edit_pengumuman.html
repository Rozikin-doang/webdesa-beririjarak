{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Edit Pengumuman - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_pengumuman' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Edit Pengumuman</h1></div>
    </div>
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Judul Pengumuman <span class="text-error">*</span></label>
            <input type="text" name="judul" value="{{ pengumuman.judul }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Tanggal Rilis <span class="text-error">*</span></label>
                <input type="date" name="tanggal_rilis" value="{{ pengumuman.tanggal_rilis|date:'Y-m-d' }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
            <div class="space-y-1 flex items-center sm:mt-6">
                <input type="checkbox" name="is_penting" id="is_penting" {% if pengumuman.is_penting %}checked{% endif %} class="w-5 h-5 rounded text-error accent-error">
                <label for="is_penting" class="ml-2 font-label-md font-semibold text-text-primary">Tandai sebagai Mendesak / Penting</label>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Ganti Gambar (Opsional)</label>
                <input type="file" name="gambar" accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Ganti Lampiran PDF (Opsional)</label>
                <input type="file" name="file_lampiran" accept=".pdf" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
        </div>

        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Isi Pengumuman <span class="text-error">*</span></label>
            <textarea name="isi_pengumuman" required rows="8" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">{{ pengumuman.isi_pengumuman }}</textarea>
        </div>

        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_pengumuman' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">save</span> Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
