{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Upload Galeri - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_galeri' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Upload Foto Kegiatan</h1></div>
    </div>
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Judul Kegiatan <span class="text-error">*</span></label><input type="text" name="judul_kegiatan" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Kategori <span class="text-error">*</span></label><input type="text" name="kategori" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Cth: Pembangunan"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Lokasi Dusun <span class="text-error">*</span></label><input type="text" name="lokasi_dusun" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Tanggal <span class="text-error">*</span></label><input type="date" name="tanggal_kegiatan" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">File Gambar <span class="text-error">*</span></label><input type="file" name="gambar" accept="image/*" required class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Deskripsi Singkat</label><textarea name="deskripsi" rows="3" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></textarea></div>
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_galeri' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md"><span class="material-symbols-outlined">save</span> Upload</button>
        </div>
    </form>
</div>
{% endblock %}
