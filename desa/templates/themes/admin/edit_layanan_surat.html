{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Edit Layanan Surat - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_layanan_surat' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Edit Layanan Surat</h1></div>
    </div>
    <form method="POST" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Nama Layanan <span class="text-error">*</span></label><input type="text" name="nama_layanan" value="{{ layanan.nama_layanan }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Kategori <span class="text-error">*</span></label><input type="text" name="kategori" value="{{ layanan.kategori }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Estimasi Waktu <span class="text-error">*</span></label><input type="text" name="estimasi_waktu" value="{{ layanan.estimasi_waktu }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Biaya <span class="text-error">*</span></label><input type="text" name="biaya" value="{{ layanan.biaya }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="space-y-1"><label class="font-label-md font-semibold">Deskripsi <span class="text-error">*</span></label><textarea name="deskripsi" required rows="3" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">{{ layanan.deskripsi }}</textarea></div>
        <div class="space-y-1"><label class="font-label-md font-semibold">Persyaratan <span class="text-error">*</span></label><textarea name="persyaratan" required rows="5" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">{{ layanan.persyaratan }}</textarea></div>
        
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_layanan_surat' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">save</span> Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
