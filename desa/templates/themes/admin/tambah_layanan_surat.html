{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Tambah Layanan Surat - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_layanan_surat' %}" class="p-2 rounded-lg bg-surface-container hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Tambah Layanan Baru</h1></div>
    </div>
    <form method="POST" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Nama Layanan <span class="text-error">*</span></label><input type="text" name="nama_layanan" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle focus:ring-2 focus:ring-primary outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Kategori <span class="text-error">*</span></label><input type="text" name="kategori" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: Kependudukan"></div>
        </div>
        <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Deskripsi Singkat <span class="text-error">*</span></label><textarea name="deskripsi" required rows="2" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle focus:ring-2 focus:ring-primary outline-none"></textarea></div>
        <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Persyaratan <span class="text-error">*</span></label><textarea name="persyaratan" required rows="5" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle focus:ring-2 focus:ring-primary outline-none" placeholder="- Fotokopi KTP&#10;- Fotokopi KK"></textarea></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Estimasi Waktu <span class="text-error">*</span></label><input type="text" name="estimasi_waktu" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Cth: 15 Menit"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold text-text-primary">Biaya <span class="text-error">*</span></label><input type="text" name="biaya" value="Rp 0 (Gratis)" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_layanan_surat' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md"><span class="material-symbols-outlined">save</span> Simpan</button>
        </div>
    </form>
</div>
{% endblock %}
