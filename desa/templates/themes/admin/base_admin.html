{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="web_dashboard" name="shell-type">
    <title>{% block title %}Dashboard SID{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f8f9ff", "surface": "#f8f9ff", "surface-container-highest": "#d3e4fe",
                        "border-subtle": "#E2E8F0", "surface-pure": "#FFFFFF", "primary": "#003527",
                        "on-background": "#0b1c30", "text-primary": "#0F172A", "on-primary-fixed-variant": "#0b513d",
                        "on-primary-fixed": "#002117", "secondary-fixed-dim": "#7bd8b1", "on-tertiary": "#ffffff",
                        "secondary-container": "#97f5cc", "on-primary-container": "#80bea6", "secondary-fixed": "#97f5cc",
                        "error": "#ba1a1a", "on-tertiary-fixed-variant": "#653e00", "on-secondary-fixed-variant": "#00513a",
                        "accent-mint": "#34D399", "on-tertiary-fixed": "#2a1700", "outline": "#707974",
                        "surface-container": "#e5eeff", "surface-container-low": "#eff4ff", "tertiary-fixed-dim": "#ffb95f",
                        "inverse-on-surface": "#eaf1ff", "on-error-container": "#93000a", "accent-emerald": "#10B981",
                        "on-error": "#ffffff", "secondary": "#006c4e", "tertiary-fixed": "#ffddb8", "error-container": "#ffdad6",
                        "on-surface-variant": "#404944", "surface-variant": "#d3e4fe", "surface-tint": "#2b6954",
                        "on-surface": "#0b1c30", "outline-variant": "#bfc9c3", "tertiary-container": "#623c00",
                        "background": "#f8f9ff", "surface-dim": "#cbdbf5", "text-secondary": "#475569",
                        "on-secondary-fixed": "#002115", "surface-bg": "#F8FAFC", "inverse-surface": "#213145",
                        "on-tertiary-container": "#f69f0d", "surface-container-high": "#dce9ff", "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#95d3ba", "primary-fixed-dim": "#95d3ba", "on-secondary-container": "#007353",
                        "primary-fixed": "#b0f0d6", "gold-light": "#FEF3C7", "on-secondary": "#ffffff",
                        "on-primary": "#ffffff", "primary-container": "#064e3b", "tertiary": "#442800"
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                    spacing: {
                        "space-xs": "0.25rem", "space-md": "1rem", "margin-mobile": "1rem", "gutter": "1.5rem",
                        "space-xl": "2rem", "gutter-mobile": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "margin": "2rem"
                    },
                    fontFamily: {
                        "label-sm": ["Inter"], "headline-xl-mobile": ["Inter"], "display-lg-mobile": ["Inter"],
                        "headline-xl": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"],
                        "display-lg": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"],
                        "headline-md": ["Inter"], "title-lg": ["Inter"], "title-md": ["Inter"], "label-md": ["Inter"]
                    },
                    fontSize: {
                        "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "500" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "title-lg": ["18px", { lineHeight: "26px", fontWeight: "600" }],
                        "headline-lg": ["30px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { overscroll-behavior: none; }
    </style>
    
    <!-- Blok untuk Menyisipkan CSS Tambahan -->
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">

    <!-- Memanggil Sidebar Kiri -->
    {% include "themes/admin/partials/sidebar.html" %}

    <!-- Area Konten Utama -->
    <div class="pl-72">
        <!-- Memanggil Header Atas -->
        {% include "themes/admin/partials/header.html" %}

        <!-- Konten Dinamis (Dashboard, Tabel, dll) -->
        <main class="w-full pt-20 px-space-lg pb-space-xl bg-surface min-h-screen">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Blok untuk Menyisipkan JavaScript Tambahan -->
    {% block extra_js %}{% endblock %}

</body>
</html>
