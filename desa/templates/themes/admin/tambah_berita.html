{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Tulis Berita - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_berita' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Tulis Berita Baru</h1></div>
    </div>
    
    <!-- TAMBAHKAN enctype="multipart/form-data" AGAR BISA UPLOAD GAMBAR -->
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        
        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Judul <span class="text-error">*</span></label>
            <input type="text" name="judul" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Kategori <span class="text-error">*</span></label>
                <select name="kategori" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
                    <option value="">-- Pilih --</option>
                    {% for kat in kategori_list %}<option value="{{ kat.id }}">{{ kat.nama }}</option>{% endfor %}
                </select>
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Status <span class="text-error">*</span></label>
                <select name="status" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
                    <option value="draft">Draft</option>
                    <option value="tayang">Tayang</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold text-text-primary">Tanggal <span class="text-error">*</span></label>
                <input type="date" name="tanggal_rilis" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
        </div>

        <!-- TAMBAHAN INPUT GAMBAR -->
        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Foto Utama Berita (Opsional)</label>
            <input type="file" name="gambar" accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-primary-container file:text-on-primary hover:file:bg-secondary cursor-pointer">
            <p class="text-xs text-text-secondary mt-1">Format: JPG, PNG. Maksimal 2MB. (Jika kosong, akan memakai gambar default).</p>
        </div>

        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Ringkasan <span class="text-error">*</span></label>
            <textarea name="ringkasan" required rows="2" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Tulis 1-2 kalimat ringkasan untuk tampil di beranda..."></textarea>
        </div>
        
        <div class="space-y-1">
            <label class="font-label-md font-semibold text-text-primary">Isi Berita <span class="text-error">*</span></label>
            <textarea name="isi_berita" required rows="8" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Tulis isi berita lengkap di sini..."></textarea>
        </div>
        
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_berita' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md flex items-center gap-2">
                <span class="material-symbols-outlined">save</span> Simpan Berita
            </button>
        </div>
    </form>
</div>
{% endblock %}
