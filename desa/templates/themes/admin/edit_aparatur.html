{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Edit Aparatur - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_aparatur' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Edit Data Aparatur</h1></div>
    </div>
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Nama Lengkap <span class="text-error">*</span></label><input type="text" name="nama" value="{{ aparatur.nama }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Jabatan <span class="text-error">*</span></label><input type="text" name="jabatan" value="{{ aparatur.jabatan }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Kategori <span class="text-error">*</span></label>
                <select name="kategori" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
                    <option value="pimpinan" {% if aparatur.kategori == 'pimpinan' %}selected{% endif %}>Pimpinan (Kades/Sekdes)</option>
                    <option value="kaur" {% if aparatur.kategori == 'kaur' %}selected{% endif %}>Kaur</option>
                    <option value="kasi" {% if aparatur.kategori == 'kasi' %}selected{% endif %}>Kasi</option>
                    <option value="kadus" {% if aparatur.kategori == 'kadus' %}selected{% endif %}>Kadus</option>
                </select>
            </div>
            <div class="space-y-1"><label class="font-label-md font-semibold">NIPD / NIAP</label><input type="text" name="nipd" value="{{ aparatur.nipd|default:'' }}" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Urutan Tampil</label><input type="number" name="urutan" value="{{ aparatur.urutan }}" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Ganti Foto (Opsional)</label><input type="file" name="foto" accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Periode Menjabat</label><input type="text" name="periode" value="{{ aparatur.periode|default:'' }}" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Kontak WA</label><input type="text" name="kontak_wa" value="{{ aparatur.kontak_wa|default:'' }}" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="space-y-1"><label class="font-label-md font-semibold">Tupoksi</label><textarea name="tupoksi" rows="3" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">{{ aparatur.tupoksi|default:'' }}</textarea></div>
        <div class="space-y-1"><label class="font-label-md font-semibold">Meja Layanan</label><input type="text" name="meja_layanan" value="{{ aparatur.meja_layanan|default:'' }}" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_aparatur' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">save</span> Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
