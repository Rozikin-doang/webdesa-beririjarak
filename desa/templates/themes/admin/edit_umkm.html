{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Edit UMKM - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_umkm' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Edit Produk UMKM</h1></div>
    </div>
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Nama Produk <span class="text-error">*</span></label><input type="text" name="nama_produk" value="{{ umkm.nama_produk }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Nama Penjual <span class="text-error">*</span></label><input type="text" name="nama_penjual" value="{{ umkm.nama_penjual }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Dusun <span class="text-error">*</span></label>
                <select name="dusun" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
                    {% for d in daftar_dusun %}
                        <option value="{{ d.id }}" {% if d.id == umkm.dusun.id %}selected{% endif %}>{{ d.nama }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Kategori <span class="text-error">*</span></label><input type="text" name="kategori" value="{{ umkm.kategori }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">WA Penjual <span class="text-error">*</span></label><input type="text" name="kontak_whatsapp" value="{{ umkm.kontak_whatsapp }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1"><label class="font-label-md font-semibold">Harga (Angka) <span class="text-error">*</span></label><input type="number" name="harga" value="{{ umkm.harga }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Satuan <span class="text-error">*</span></label><input type="text" name="satuan" value="{{ umkm.satuan }}" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
            <div class="space-y-1"><label class="font-label-md font-semibold">Ganti Gambar (Opsional)</label><input type="file" name="gambar_produk" accept="image/*" class="w-full px-4 py-2 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></div>
        </div>
        <div class="space-y-1"><label class="font-label-md font-semibold">Deskripsi Produk <span class="text-error">*</span></label><textarea name="deskripsi" required rows="4" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">{{ umkm.deskripsi }}</textarea></div>
        <div class="space-y-1 flex items-center">
            <input type="checkbox" name="is_unggulan" id="is_unggulan" {% if umkm.is_unggulan %}checked{% endif %} class="w-5 h-5 rounded text-primary accent-primary">
            <label for="is_unggulan" class="ml-2 font-label-md font-semibold text-text-primary">Jadikan Produk Unggulan</label>
        </div>
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_umkm' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md flex items-center gap-2"><span class="material-symbols-outlined text-[20px]">save</span> Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
