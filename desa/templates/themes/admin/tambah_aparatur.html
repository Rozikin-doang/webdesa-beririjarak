{% extends "themes/admin/base_admin.html" %}
{% load static %}

{% block title %}Tambah Aparatur - SID{% endblock %}

{% block content %}
<div class="flex flex-col w-full max-w-4xl mx-auto gap-space-lg">
    <div class="flex items-center gap-4">
        <a href="{% url 'kelola_aparatur' %}" class="p-2 rounded-lg bg-surface-container"><span class="material-symbols-outlined text-primary">arrow_back</span></a>
        <div><h1 class="font-headline-lg text-headline-lg font-bold text-text-primary">Tambah Data Aparatur</h1></div>
    </div>
    <form method="POST" enctype="multipart/form-data" class="bg-surface-pure rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col gap-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Nama Lengkap <span class="text-error">*</span></label>
                <input type="text" name="nama" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Jabatan <span class="text-error">*</span></label>
                <input type="text" name="jabatan" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Cth: Kepala Desa, Kaur TU">
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Kategori <span class="text-error">*</span></label>
                <select name="kategori" required class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
                    <option value="pimpinan">Pimpinan (Kades/Sekdes)</option>
                    <option value="kaur">Kaur</option>
                    <option value="kasi">Kasi</option>
                    <option value="kadus">Kadus</option>
                </select>
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold">NIPD / NIAP</label>
                <input type="text" name="nipd" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Urutan Tampil</label>
                <input type="number" name="urutan" value="0" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Foto (Opsional)</label>
                <input type="file" name="foto" accept="image/*" class="w-full px-4 py-2.5 rounded-xl bg-surface-container-low border border-border-subtle outline-none">
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Periode Menjabat</label>
                <input type="text" name="periode" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Cth: 2019 - Sekarang">
            </div>
            <div class="space-y-1">
                <label class="font-label-md font-semibold">Kontak WA</label>
                <input type="text" name="kontak_wa" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="628xxx">
            </div>
        </div>
        <div class="space-y-1">
            <label class="font-label-md font-semibold">Tupoksi (Tugas Pokok & Fungsi)</label>
            <textarea name="tupoksi" rows="3" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none"></textarea>
        </div>
        <div class="space-y-1">
            <label class="font-label-md font-semibold">Meja Layanan</label>
            <input type="text" name="meja_layanan" class="w-full px-4 py-3 rounded-xl bg-surface-container-low border border-border-subtle outline-none" placeholder="Cth: Meja Layanan No. 01">
        </div>
        
        <div class="pt-4 border-t border-border-subtle flex justify-end gap-3">
            <a href="{% url 'kelola_aparatur' %}" class="px-5 py-2.5 rounded-xl bg-surface-container font-semibold">Batal</a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary font-bold shadow-md"><span class="material-symbols-outlined">save</span> Simpan</button>
        </div>
    </form>
</div>
{% endblock %}
